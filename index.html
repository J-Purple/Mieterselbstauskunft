<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mieterselbstauskunft</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/toolbar.css">
<link rel="stylesheet" href="css/page.css">
<link rel="stylesheet" href="css/tabs.css">
<link rel="stylesheet" href="css/form-a.css">
<link rel="stylesheet" href="css/form-b.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/print.css">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/room.js"></script>
<script src="js/sync.js"></script>
<script src="js/ui.js"></script>
<script src="js/setup-check.js"></script>
</head>
<body>
<!-- Setup warning shown if config not replaced -->
<div id="setupBanner">
  ⚠️ <strong>Firebase not configured yet.</strong> Real-time sync is disabled.
  <a href="https://console.firebase.google.com" rel="noopener" target="_blank">Create a free Firebase project</a>,
  replace the config in the js/firebase-config.js file, then re-publish. Until then, the form works locally but changes won't sync between users.
</div>

<div class="toolbar">
<span class="status-dot" id="statusDot"></span>
<span id="roomId">Room: —</span>
<button class="btn-tool" id="btnChangeRoom" style="margin-left: 10px; padding: 2px 8px; font-size: 12px; height: 24px;">✎ Change Room</button>
<span style="color:#666; font-size:10px; margin-left:10px;">|</span>
<div class="toolbar-right">
<button class="btn-tool" id="copyLink">🔗 Share Link</button>
<button class="btn-tool" id="btnClear">Clear All</button>
<button class="btn-primary-tool" onclick="window.print()">🖨 Print / Save PDF</button>
</div>
</div>
<div class="tab-bar">
<button class="tab-btn active" onclick="switchTab('formA', this)">Version A — Kurzform</button>
<button class="tab-btn" onclick="switchTab('formB', this)">Version B — Vollform</button>
</div>

<div class="form-panel active" id="formA"></div>
<div class="form-panel" id="formB"></div>

<script src="forms/form-a.js"></script>
<script src="forms/form-b.js"></script>
<script>
  // Insert the HTML that was loaded via the script files
  document.getElementById('formA').innerHTML = window.formA_HTML;
  document.getElementById('formB').innerHTML = window.formB_HTML;
  
  // Dispatch an event to signal forms are loaded
  document.dispatchEvent(new Event('formsLoaded'));
</script>
</body>
</html>
